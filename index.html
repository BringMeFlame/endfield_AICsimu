<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Infinite Grid Canvas Demo</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #1e1e1e;
  }
  canvas {
    display: block;
    width: 100vw;
    height: 100vh;
    touch-action: none;
  }
  #hint {
    position: fixed;
    top: 12px;
    left: 100px;
    color: #cfcfcf;
    font-family: system-ui, sans-serif;
    font-size: 13px;
    line-height: 1.6;
    background: rgba(0, 0, 0, 0.35);
    padding: 8px 12px;
    border-radius: 6px;
    pointer-events: none;
    user-select: none;
    z-index: 5;
  }

  #toolbar {
    position: fixed;
    top: 0;
    left: 0;
    width: 84px;
    height: 100vh;
    background: rgba(30, 30, 30, 0.92);
    border-right: 1px solid rgba(255, 255, 255, 0.12);
    box-sizing: border-box;
    padding: 16px 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    z-index: 10;
    user-select: none;
  }
  #toolbar .toolbar-title {
    color: #888;
    font-family: system-ui, sans-serif;
    font-size: 11px;
    margin-bottom: 4px;
  }
  .device-icon {
    width: 56px;
    height: 56px;
    background: #ffffff;
    border: 3px solid #111;
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    font-family: system-ui, sans-serif;
    font-size: 12px;
    font-weight: 600;
    color: #111;
    cursor: grab;
    box-shadow: 0 2px 6px rgba(0,0,0,0.4);
  }
  .device-icon:active {
    cursor: grabbing;
  }

  /* 拖拽生成时跟随鼠标的幽灵图标 */
  #ghost-icon {
    position: fixed;
    width: 56px;
    height: 56px;
    background: #ffffff;
    border: 3px solid #111;
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    font-family: system-ui, sans-serif;
    font-size: 12px;
    font-weight: 600;
    color: #111;
    pointer-events: none;
    opacity: 0.85;
    z-index: 20;
    display: none;
  }
</style>
</head>
<body>
<canvas id="canvas"></canvas>

<div id="toolbar">
  <div class="toolbar-title">设备库</div>
  <div class="device-icon" id="crusher-icon">粉碎机</div>
</div>

<div id="ghost-icon">粉碎机</div>

<div id="hint">
  拖拽空白处：平移画布　|　滚轮：缩放<br>
  从左侧工具栏拖出图标：放置设备<br>
  点击设备：选中（高亮边框）　|　Delete / Backspace：删除选中设备/连线<br>
  设备网格重叠时会实时标红警示<br>
  从蓝色输入口/橙色输出口拖拽：橙色输出口拉到蓝色输入口自动生成传送带（A* 直角寻路）<br>
  拖动设备时，相连的传送带会实时重新寻路
</div>

<script>
(() => {
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  const toolbar = document.getElementById('toolbar');
  const crusherIcon = document.getElementById('crusher-icon');
  const ghostIcon = document.getElementById('ghost-icon');

  // ---- 世界坐标系参数 ----
  const GRID_SIZE = 50; // 每个网格单元的世界坐标尺寸(px)
  let scale = 1;
  let offsetX = 0;
  let offsetY = 0;

  // ---- 端口 / 寻路参数 ----
  const PORT_COUNT = 3;        // 每台设备的输入口/输出口数量
  const PORT_HIT_RADIUS = 8;   // 端口拾取半径(屏幕像素)
  const TURN_PENALTY = 3;      // A* 转弯惩罚(每次拐弯额外代价)
  const DIR_E = 0, DIR_S = 1, DIR_W = 2, DIR_N = 3;
  const DIR_VECT = [{ dx: 1, dy: 0 }, { dx: 0, dy: 1 }, { dx: -1, dy: 0 }, { dx: 0, dy: -1 }];

  // ---- 设备数据 ----
  // devices: { id, gridX, gridY, w, h, color, borderColor, label }
  let devices = [];
  let nextId = 1;

  let selectedId = null;

  // ---- 传送带连线数据 ----
  // connections: { id, fromDeviceId, fromPort, toDeviceId, toPort, points:[{x,y}], invalid }
  let connections = [];
  let nextConnId = 1;
  let selectedConnectionId = null;

  // ---- 从输出口拖拽生成连线的状态 ----
  let wireDragging = false;
  let wireDragFrom = null; // { deviceId, index, x, y }
  let wireDragCurrent = { x: 0, y: 0 };
  let hoverInputPort = null; // { deviceId, index }

  // ---- 画布内交互状态 ----
  let isPanning = false;
  let lastMouseX = 0;
  let lastMouseY = 0;

  let draggingDeviceId = null;
  let dragOffsetWX = 0;
  let dragOffsetWY = 0;
  let dragDeviceWX = 0; // 拖拽中设备左上角的实时(已吸附)世界坐标
  let dragDeviceWY = 0;

  // ---- 从工具栏拖拽生成新设备的状态 ----
  let spawning = false;
  const spawnTemplate = { w: 3, h: 3, color: '#ffffff', borderColor: '#111111', label: '粉碎机' };
  let spawnPreview = null; // { gridX, gridY, w, h } 悬停在画布上时的吸附预览

  function resize() {
    canvas.width = window.innerWidth * devicePixelRatio;
    canvas.height = window.innerHeight * devicePixelRatio;
    canvas.style.width = window.innerWidth + 'px';
    canvas.style.height = window.innerHeight + 'px';
    ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
    draw();
  }
  window.addEventListener('resize', resize);

  function screenToWorld(sx, sy) {
    return { x: (sx - offsetX) / scale, y: (sy - offsetY) / scale };
  }
  function worldToScreen(wx, wy) {
    return { x: wx * scale + offsetX, y: wy * scale + offsetY };
  }

  function initView() {
    offsetX = window.innerWidth / 2;
    offsetY = window.innerHeight / 2;
  }

  function getDeviceRectWorld(gridX, gridY, w, h) {
    return { x: gridX * GRID_SIZE, y: gridY * GRID_SIZE, w: w * GRID_SIZE, h: h * GRID_SIZE };
  }

  // 获取某设备当前的"有效"网格位置(若正在被拖拽则用拖拽中的实时位置)
  function effectiveGridPos(dev) {
    if (dev.id === draggingDeviceId) {
      return { gridX: Math.round(dragDeviceWX / GRID_SIZE), gridY: Math.round(dragDeviceWY / GRID_SIZE) };
    }
    return { gridX: dev.gridX, gridY: dev.gridY };
  }

  function rectsOverlap(a, b) {
    return !(a.gridX + a.w <= b.gridX || b.gridX + b.w <= a.gridX ||
             a.gridY + a.h <= b.gridY || b.gridY + b.h <= a.gridY);
  }

  // 计算当前所有设备中互相重叠(碰撞)的设备 id 集合
  function computeCollidingIds() {
    const colliding = new Set();
    const rects = devices.map(d => {
      const pos = effectiveGridPos(d);
      return { id: d.id, gridX: pos.gridX, gridY: pos.gridY, w: d.w, h: d.h };
    });
    for (let i = 0; i < rects.length; i++) {
      for (let j = i + 1; j < rects.length; j++) {
        if (rectsOverlap(rects[i], rects[j])) {
          colliding.add(rects[i].id);
          colliding.add(rects[j].id);
        }
      }
    }
    return colliding;
  }

  function hitTestDevice(worldX, worldY) {
    // 从后往上(数组末尾即最上层)遍历，返回命中的设备
    for (let i = devices.length - 1; i >= 0; i--) {
      const dev = devices[i];
      const pos = effectiveGridPos(dev);
      const rect = getDeviceRectWorld(pos.gridX, pos.gridY, dev.w, dev.h);
      if (worldX >= rect.x && worldX <= rect.x + rect.w &&
          worldY >= rect.y && worldY <= rect.y + rect.h) {
        return dev;
      }
    }
    return null;
  }

  // ---- 端口(输入口/输出口) ----

  // 计算设备的输入口/输出口世界坐标。输入口在左边缘、输出口在右边缘，
  // 每行一个端口，物料始终沿 +x 方向流动(输入口箭头指入设备，输出口箭头指出设备)。
  // cellCol/cellRow 是紧贴该端口、位于设备外侧的网格单元，作为寻路的起止格。
  function getDevicePorts(dev, pos) {
    const inputs = [], outputs = [];
    const leftX = pos.gridX * GRID_SIZE;
    const rightX = (pos.gridX + dev.w) * GRID_SIZE;
    const topY = pos.gridY * GRID_SIZE;
    const count = Math.min(PORT_COUNT, dev.h);
    for (let i = 0; i < count; i++) {
      const py = topY + (i + 0.5) * GRID_SIZE;
      inputs.push({ index: i, x: leftX, y: py, cellCol: pos.gridX - 1, cellRow: pos.gridY + i });
      outputs.push({ index: i, x: rightX, y: py, cellCol: pos.gridX + dev.w, cellRow: pos.gridY + i });
    }
    return { inputs, outputs };
  }

  function findPortAt(clientX, clientY, portType) {
    for (let i = devices.length - 1; i >= 0; i--) {
      const dev = devices[i];
      const pos = effectiveGridPos(dev);
      const ports = getDevicePorts(dev, pos);
      const list = portType === 'output' ? ports.outputs : ports.inputs;
      for (const p of list) {
        const s = worldToScreen(p.x, p.y);
        const dx = clientX - s.x, dy = clientY - s.y;
        if (dx * dx + dy * dy <= PORT_HIT_RADIUS * PORT_HIT_RADIUS) {
          return { deviceId: dev.id, index: p.index, x: p.x, y: p.y, cellCol: p.cellCol, cellRow: p.cellRow };
        }
      }
    }
    return null;
  }

  function isOutputPortUsed(deviceId, index) {
    return connections.some(c => c.fromDeviceId === deviceId && c.fromPort === index);
  }
  function isInputPortUsed(deviceId, index) {
    return connections.some(c => c.toDeviceId === deviceId && c.toPort === index);
  }

  // ---- 正交 A* 寻路(带转弯惩罚) ----

  class MinHeap {
    constructor() { this.items = []; }
    get size() { return this.items.length; }
    push(item) {
      const a = this.items;
      a.push(item);
      let i = a.length - 1;
      while (i > 0) {
        const p = (i - 1) >> 1;
        if (a[p].f <= a[i].f) break;
        [a[p], a[i]] = [a[i], a[p]];
        i = p;
      }
    }
    pop() {
      const a = this.items;
      const top = a[0];
      const last = a.pop();
      if (a.length) {
        a[0] = last;
        let i = 0;
        while (true) {
          const l = 2 * i + 1, r = 2 * i + 2;
          let smallest = i;
          if (l < a.length && a[l].f < a[smallest].f) smallest = l;
          if (r < a.length && a[r].f < a[smallest].f) smallest = r;
          if (smallest === i) break;
          [a[smallest], a[i]] = [a[i], a[smallest]];
          i = smallest;
        }
      }
      return top;
    }
  }

  function manhattan(c1, r1, c2, r2) {
    return Math.abs(c1 - c2) + Math.abs(r1 - r2);
  }

  function buildBlockedSet() {
    const set = new Set();
    for (const dev of devices) {
      const pos = effectiveGridPos(dev);
      for (let dx = 0; dx < dev.w; dx++) {
        for (let dy = 0; dy < dev.h; dy++) {
          set.add((pos.gridX + dx) + ',' + (pos.gridY + dy));
        }
      }
    }
    return set;
  }

  function orientationOf(dir) {
    return (dir === DIR_E || dir === DIR_W) ? 'H' : 'V';
  }

  // 相邻格 a -> b 的移动方向
  function dirBetween(a, b) {
    if (b.col === a.col + 1) return DIR_E;
    if (b.col === a.col - 1) return DIR_W;
    if (b.row === a.row + 1) return DIR_S;
    return DIR_N;
  }

  // 给定一条连线的格子路径，得到它经过每个格子时使用的朝向('H'/'V')。
  // 起点视为从端口沿 +x 方向进入，终点视为沿 +x 方向进入端口。
  function cellOrientationsOf(cellPath) {
    const list = [];
    for (let i = 0; i < cellPath.length; i++) {
      const entryDir = i === 0 ? DIR_E : dirBetween(cellPath[i - 1], cellPath[i]);
      const exitDir = i === cellPath.length - 1 ? DIR_E : dirBetween(cellPath[i], cellPath[i + 1]);
      list.push({ cell: cellPath[i], entryDir, exitDir });
    }
    return list;
  }

  // 汇总其它传送带占用的格子及朝向，用于新路径的"不可重叠、但允许交叉"约束。
  // excludeConnId 用于在重新计算某条连线自身路径时，排除它自己之前占用的格子。
  function buildBeltOccupancy(excludeConnId) {
    const map = new Map();
    for (const c of connections) {
      if (c.id === excludeConnId || !c.cellPath) continue;
      for (const { cell, entryDir, exitDir } of cellOrientationsOf(c.cellPath)) {
        const key = cell.col + ',' + cell.row;
        let set = map.get(key);
        if (!set) { set = new Set(); map.set(key, set); }
        set.add(orientationOf(entryDir));
        set.add(orientationOf(exitDir));
      }
    }
    return map;
  }

  // 状态空间为 (col, row, dir)：dir 表示到达该格时的移动方向，用于计算转弯惩罚。
  // 起点视为"刚从输出口沿 +x 方向进入格子"，终点要求"沿 +x 方向进入格子"才算到达输入口，
  // 这样生成的路径两端总是与设备边缘垂直、笔直地接入端口。
  // beltOccupancy 记录其它传送带占用的格子及朝向：同朝向直行视为重叠(禁止)，
  // 仅垂直方向穿过视为合法交叉(允许，渲染时生成物流桥)；已被占用的格子内不允许转弯。
  function aStarOrthogonal(startCol, startRow, goalCol, goalRow, blocked, beltOccupancy) {
    if (startCol === goalCol && startRow === goalRow) {
      return [{ col: startCol, row: startRow }];
    }
    let margin = 16;
    for (let attempt = 0; attempt < 2; attempt++, margin *= 2) {
      const minC = Math.min(startCol, goalCol) - margin, maxC = Math.max(startCol, goalCol) + margin;
      const minR = Math.min(startRow, goalRow) - margin, maxR = Math.max(startRow, goalRow) + margin;

      const gScore = new Map();
      const cameFrom = new Map();
      const startKey = startCol + ',' + startRow + ',' + DIR_E;
      gScore.set(startKey, 0);

      const heap = new MinHeap();
      heap.push({ key: startKey, col: startCol, row: startRow, dir: DIR_E, f: manhattan(startCol, startRow, goalCol, goalRow) });
      const closed = new Set();

      while (heap.size) {
        const node = heap.pop();
        if (closed.has(node.key)) continue;
        closed.add(node.key);

        if (node.col === goalCol && node.row === goalRow && node.dir === DIR_E) {
          const path = [];
          let curKey = node.key;
          while (curKey) {
            const [c, r] = curKey.split(',').map(Number);
            path.push({ col: c, row: r });
            curKey = cameFrom.get(curKey);
          }
          path.reverse();
          return path;
        }

        for (let d = 0; d < 4; d++) {
          const nc = node.col + DIR_VECT[d].dx;
          const nr = node.row + DIR_VECT[d].dy;
          if (nc < minC || nc > maxC || nr < minR || nr > maxR) continue;
          if (blocked.has(nc + ',' + nr)) continue;
          const turn = d === node.dir ? 0 : 1;

          if (turn) {
            // 转弯必须发生在没有其它传送带占用的格子，避免拐角与既有带体重叠
            const curOcc = beltOccupancy.get(node.col + ',' + node.row);
            if (curOcc && curOcc.size > 0) continue;
          } else {
            // 直行：目标格若已被同朝向占用视为重叠，禁止；仅被垂直朝向占用则视为合法交叉
            const nOcc = beltOccupancy.get(nc + ',' + nr);
            if (nOcc && nOcc.has(orientationOf(d))) continue;
          }

          const stepCost = 1 + turn * TURN_PENALTY;
          const ng = gScore.get(node.key) + stepCost;
          const nkey = nc + ',' + nr + ',' + d;
          if (!gScore.has(nkey) || ng < gScore.get(nkey)) {
            gScore.set(nkey, ng);
            cameFrom.set(nkey, node.key);
            const h = manhattan(nc, nr, goalCol, goalRow);
            heap.push({ key: nkey, col: nc, row: nr, dir: d, f: ng + h });
          }
        }
      }
    }
    return null;
  }

  function dedupePoints(pts) {
    const out = [pts[0]];
    for (let i = 1; i < pts.length; i++) {
      const a = out[out.length - 1], b = pts[i];
      if (Math.abs(a.x - b.x) > 0.01 || Math.abs(a.y - b.y) > 0.01) out.push(b);
    }
    return out;
  }

  // 合并折线中方向相同的连续共线点，得到干净的直角拐点序列
  function simplifyCollinear(pts) {
    if (pts.length < 3) return pts;
    const out = [pts[0]];
    for (let i = 1; i < pts.length - 1; i++) {
      const prev = out[out.length - 1], cur = pts[i], next = pts[i + 1];
      const dx1 = cur.x - prev.x, dy1 = cur.y - prev.y;
      const dx2 = next.x - cur.x, dy2 = next.y - cur.y;
      const collinear =
        (dx1 === 0 && dx2 === 0 && Math.sign(dy1) === Math.sign(dy2)) ||
        (dy1 === 0 && dy2 === 0 && Math.sign(dx1) === Math.sign(dx2));
      if (!collinear) out.push(cur);
    }
    out.push(pts[pts.length - 1]);
    return out;
  }

  // 计算一条连线从输出口到输入口的最佳直角路径。
  // 传送带之间不允许重叠，但允许十字交叉(交叉处渲染物流桥)，因此需要排除
  // 该连线自身之前占用的格子后，再依据其它连线的占用情况进行寻路。
  function computePath(conn) {
    const fromDev = devices.find(d => d.id === conn.fromDeviceId);
    const toDev = devices.find(d => d.id === conn.toDeviceId);
    if (!fromDev || !toDev) return { points: [], cellPath: null, invalid: true };

    const fromPos = effectiveGridPos(fromDev);
    const toPos = effectiveGridPos(toDev);
    const startPort = getDevicePorts(fromDev, fromPos).outputs[conn.fromPort];
    const endPort = getDevicePorts(toDev, toPos).inputs[conn.toPort];
    if (!startPort || !endPort) return { points: [], cellPath: null, invalid: true };

    const blocked = buildBlockedSet();
    const beltOccupancy = buildBeltOccupancy(conn.id);
    const cellPath = aStarOrthogonal(startPort.cellCol, startPort.cellRow, endPort.cellCol, endPort.cellRow, blocked, beltOccupancy);
    if (!cellPath) {
      return { points: [{ x: startPort.x, y: startPort.y }, { x: endPort.x, y: endPort.y }], cellPath: null, invalid: true };
    }

    const pts = [{ x: startPort.x, y: startPort.y }];
    for (const c of cellPath) {
      pts.push({ x: (c.col + 0.5) * GRID_SIZE, y: (c.row + 0.5) * GRID_SIZE });
    }
    pts.push({ x: endPort.x, y: endPort.y });

    return { points: simplifyCollinear(dedupePoints(pts)), cellPath, invalid: false };
  }

  // 设备布局发生任何变化(拖动/新增/删除)都可能影响其他连线的最佳绕行路径，
  // 因此统一重新计算全部连线，而不仅是与该设备直接相连的连线。
  function recomputeAllConnections() {
    for (const c of connections) {
      const res = computePath(c);
      c.points = res.points;
      c.cellPath = res.cellPath;
      c.invalid = res.invalid;
    }
  }

  // 找出所有传送带的合法交叉点(一条水平直行 + 一条垂直直行共用同一格)，
  // 用于在绘制时生成物流桥。约定：水平方向的传送带走"桥面"，垂直方向的走"桥下"。
  function computeCrossings() {
    const cellMap = new Map();
    for (const c of connections) {
      if (!c.cellPath) continue;
      for (const { cell, entryDir, exitDir } of cellOrientationsOf(c.cellPath)) {
        if (entryDir !== exitDir) continue; // 拐弯格不可能与其它传送带共用，跳过
        const key = cell.col + ',' + cell.row;
        let arr = cellMap.get(key);
        if (!arr) { arr = []; cellMap.set(key, arr); }
        arr.push({ conn: c, orientation: orientationOf(entryDir) });
      }
    }
    const crossings = [];
    for (const [key, arr] of cellMap) {
      const h = arr.find(e => e.orientation === 'H');
      const v = arr.find(e => e.orientation === 'V');
      if (h && v) {
        const [col, row] = key.split(',').map(Number);
        crossings.push({ col, row, overConn: h.conn });
      }
    }
    return crossings;
  }

  function distPointToSegment(px, py, ax, ay, bx, by) {
    const dx = bx - ax, dy = by - ay;
    const lenSq = dx * dx + dy * dy;
    let t = lenSq === 0 ? 0 : ((px - ax) * dx + (py - ay) * dy) / lenSq;
    t = Math.max(0, Math.min(1, t));
    const cx = ax + t * dx, cy = ay + t * dy;
    return Math.hypot(px - cx, py - cy);
  }

  function hitTestConnection(clientX, clientY) {
    const THRESH = BELT_WIDTH / 2 + 2;
    for (let i = connections.length - 1; i >= 0; i--) {
      const c = connections[i];
      if (!c.points || c.points.length < 2) continue;
      for (let j = 0; j < c.points.length - 1; j++) {
        const a = worldToScreen(c.points[j].x, c.points[j].y);
        const b = worldToScreen(c.points[j + 1].x, c.points[j + 1].y);
        if (distPointToSegment(clientX, clientY, a.x, a.y, b.x, b.y) <= THRESH) return c;
      }
    }
    return null;
  }

  // ---- 绘制 ----

  function drawGrid() {
    const w = window.innerWidth;
    const h = window.innerHeight;

    ctx.clearRect(0, 0, w, h);
    ctx.fillStyle = '#1e1e1e';
    ctx.fillRect(0, 0, w, h);

    const topLeft = screenToWorld(0, 0);
    const bottomRight = screenToWorld(w, h);

    const startCol = Math.floor(topLeft.x / GRID_SIZE);
    const endCol = Math.ceil(bottomRight.x / GRID_SIZE);
    const startRow = Math.floor(topLeft.y / GRID_SIZE);
    const endRow = Math.ceil(bottomRight.y / GRID_SIZE);

    ctx.strokeStyle = 'rgba(255,255,255,0.08)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let col = startCol; col <= endCol; col++) {
      const sx = Math.round(worldToScreen(col * GRID_SIZE, 0).x) + 0.5;
      ctx.moveTo(sx, 0);
      ctx.lineTo(sx, h);
    }
    for (let row = startRow; row <= endRow; row++) {
      const sy = Math.round(worldToScreen(0, row * GRID_SIZE).y) + 0.5;
      ctx.moveTo(0, sy);
      ctx.lineTo(w, sy);
    }
    ctx.stroke();

    ctx.strokeStyle = 'rgba(255,255,255,0.2)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    const originScreen = worldToScreen(0, 0);
    ctx.moveTo(originScreen.x, 0);
    ctx.lineTo(originScreen.x, h);
    ctx.moveTo(0, originScreen.y);
    ctx.lineTo(w, originScreen.y);
    ctx.stroke();
  }

  function drawDeviceRect(rect, dev, opts) {
    const topLeft = worldToScreen(rect.x, rect.y);
    const sw = rect.w * scale;
    const sh = rect.h * scale;

    ctx.save();
    ctx.globalAlpha = opts.dragging ? 0.85 : 1;
    ctx.fillStyle = dev.color;
    ctx.fillRect(topLeft.x, topLeft.y, sw, sh);

    ctx.lineWidth = 2;
    ctx.strokeStyle = dev.borderColor;
    ctx.strokeRect(topLeft.x, topLeft.y, sw, sh);

    // 重叠警示：半透明红色覆盖 + 红色描边
    if (opts.colliding) {
      ctx.fillStyle = 'rgba(255, 0, 0, 0.45)';
      ctx.fillRect(topLeft.x, topLeft.y, sw, sh);
      ctx.lineWidth = 2;
      ctx.strokeStyle = '#ff1744';
      ctx.strokeRect(topLeft.x, topLeft.y, sw, sh);
    }

    // 选中高亮
    if (opts.selected) {
      ctx.lineWidth = 3;
      ctx.strokeStyle = '#ffeb3b';
      ctx.setLineDash([6, 4]);
      ctx.strokeRect(topLeft.x - 3, topLeft.y - 3, sw + 6, sh + 6);
      ctx.setLineDash([]);
    }

    // 标签
    if (sw > 24 && sh > 16) {
      ctx.globalAlpha = 1;
      ctx.fillStyle = '#111';
      ctx.font = `${Math.max(10, Math.min(16, sh * 0.22))}px system-ui, sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(dev.label, topLeft.x + sw / 2, topLeft.y + sh / 2);
    }

    ctx.restore();
  }

  function drawDevices() {
    const collidingIds = computeCollidingIds();
    for (const dev of devices) {
      const pos = effectiveGridPos(dev);
      const rect = getDeviceRectWorld(pos.gridX, pos.gridY, dev.w, dev.h);
      drawDeviceRect(rect, dev, {
        dragging: dev.id === draggingDeviceId,
        colliding: collidingIds.has(dev.id),
        selected: dev.id === selectedId
      });
      drawDevicePorts(dev, pos);
    }
  }

  // 端口悬停状态：拖拽连线时若正悬停在该输入口上，返回 'valid' / 'invalid'
  function portHoverState(type, deviceId, index) {
    if (type !== 'input' || !wireDragging || !hoverInputPort) return null;
    if (hoverInputPort.deviceId !== deviceId || hoverInputPort.index !== index) return null;
    const sameDevice = deviceId === wireDragFrom.deviceId;
    const used = isInputPortUsed(deviceId, index);
    return (!sameDevice && !used) ? 'valid' : 'invalid';
  }

  function drawPortMarker(p, type, deviceId, connected) {
    const screen = worldToScreen(p.x, p.y);
    const hover = portHoverState(type, deviceId, p.index);

    let fill = type === 'input' ? '#42a5f5' : '#ffa726';
    if (connected) fill = '#66bb6a';
    if (hover === 'valid') fill = '#66bb6a';
    if (hover === 'invalid') fill = '#ff1744';

    ctx.save();
    ctx.fillStyle = fill;
    ctx.strokeStyle = '#111';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(screen.x, screen.y, 6, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();

    // 方向箭头：物料始终沿 +x 方向流动
    ctx.fillStyle = '#111';
    ctx.beginPath();
    ctx.moveTo(screen.x + 5, screen.y);
    ctx.lineTo(screen.x - 2, screen.y - 4);
    ctx.lineTo(screen.x - 2, screen.y + 4);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  function drawDevicePorts(dev, pos) {
    const ports = getDevicePorts(dev, pos);
    for (const p of ports.inputs) drawPortMarker(p, 'input', dev.id, isInputPortUsed(dev.id, p.index));
    for (const p of ports.outputs) drawPortMarker(p, 'output', dev.id, isOutputPortUsed(dev.id, p.index));
  }

  const BELT_WIDTH = 14;      // 传送带整体宽度(屏幕像素，含外框)
  const BELT_RUNG_STEP = 14;  // 传送带纹路(辊轴刻线)间距

  function pathToScreen(points) {
    return points.map(p => worldToScreen(p.x, p.y));
  }

  function buildScreenPath2D(screenPoints) {
    const path = new Path2D();
    path.moveTo(screenPoints[0].x, screenPoints[0].y);
    for (let i = 1; i < screenPoints.length; i++) path.lineTo(screenPoints[i].x, screenPoints[i].y);
    return path;
  }

  // 沿折线绘制均匀分布的垂直刻线，模拟传送带辊轴纹理(拐弯处也保持等间距)
  function drawBeltRungs(screenPoints, color) {
    const rungLen = BELT_WIDTH * 0.8;
    ctx.save();
    ctx.strokeStyle = color;
    ctx.lineWidth = 2;
    ctx.beginPath();
    let carry = BELT_RUNG_STEP / 2;
    for (let i = 0; i < screenPoints.length - 1; i++) {
      const a = screenPoints[i], b = screenPoints[i + 1];
      const dx = b.x - a.x, dy = b.y - a.y;
      const len = Math.hypot(dx, dy);
      if (len < 1e-6) continue;
      const ux = dx / len, uy = dy / len;
      const px = -uy, py = ux;
      let d = carry;
      while (d < len) {
        const cx = a.x + ux * d, cy = a.y + uy * d;
        ctx.moveTo(cx + px * rungLen / 2, cy + py * rungLen / 2);
        ctx.lineTo(cx - px * rungLen / 2, cy - py * rungLen / 2);
        d += BELT_RUNG_STEP;
      }
      carry = d - len;
    }
    ctx.stroke();
    ctx.restore();
  }

  function drawFlowArrows(screenPoints) {
    for (let i = 0; i < screenPoints.length - 1; i++) {
      const a = screenPoints[i], b = screenPoints[i + 1];
      const dx = b.x - a.x, dy = b.y - a.y;
      const len = Math.hypot(dx, dy);
      if (len < 20) continue;
      const ux = dx / len, uy = dy / len;
      const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
      const size = 5;
      ctx.save();
      ctx.fillStyle = '#fff3e0';
      ctx.beginPath();
      ctx.moveTo(mx + ux * size, my + uy * size);
      ctx.lineTo(mx - ux * size - uy * size * 0.6, my - uy * size + ux * size * 0.6);
      ctx.lineTo(mx - ux * size + uy * size * 0.6, my - uy * size - ux * size * 0.6);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }
  }

  // 传送带渲染为一条带状：深色外框(轨道) + 主色表面 + 等距辊轴刻线 + 流向箭头
  function drawConnectionPath(c, opts) {
    if (!c.points || c.points.length < 2) return;
    const screenPoints = pathToScreen(c.points);
    const path = buildScreenPath2D(screenPoints);

    let railColor, surfaceColor;
    if (c.invalid) { railColor = '#7a1020'; surfaceColor = '#ff1744'; }
    else if (opts.selected) { railColor = '#8a6f00'; surfaceColor = '#ffeb3b'; }
    else { railColor = '#5c3d12'; surfaceColor = '#ffa726'; }

    ctx.save();
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';
    if (c.invalid) ctx.setLineDash([10, 6]);

    ctx.strokeStyle = railColor;
    ctx.lineWidth = BELT_WIDTH;
    ctx.stroke(path);

    ctx.strokeStyle = surfaceColor;
    ctx.lineWidth = BELT_WIDTH - 5;
    ctx.stroke(path);

    ctx.setLineDash([]);
    ctx.restore();

    if (!c.invalid) {
      drawBeltRungs(screenPoints, railColor);
      drawFlowArrows(screenPoints);
    }
  }

  function roundRectPathAt(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  // 物流桥：横向传送带贯穿桥面，纵向传送带从桥下的通道穿过，用于表示两条
  // 传送带在此正交交叉而非物理重叠。
  function drawLogisticsBridge(col, row, overColor) {
    const center = worldToScreen((col + 0.5) * GRID_SIZE, (row + 0.5) * GRID_SIZE);
    const deckSize = BELT_WIDTH + 10;
    const half = deckSize / 2;
    const tw = BELT_WIDTH - 5;

    ctx.save();
    ctx.translate(center.x, center.y);

    ctx.fillStyle = '#374151';
    roundRectPathAt(-half, -half, deckSize, deckSize, 4);
    ctx.fill();

    ctx.fillStyle = '#8b95a1';
    roundRectPathAt(-half + 2, -half + 2, deckSize - 4, deckSize - 4, 3);
    ctx.fill();

    // 桥下(纵向传送带)的通道口
    ctx.fillStyle = '#20242b';
    ctx.fillRect(-tw / 2, -half, tw, 3);
    ctx.fillRect(-tw / 2, half - 3, tw, 3);

    // 桥面(横向传送带)贯穿而过
    ctx.strokeStyle = overColor;
    ctx.lineWidth = tw;
    ctx.lineCap = 'butt';
    ctx.beginPath();
    ctx.moveTo(-half, 0);
    ctx.lineTo(half, 0);
    ctx.stroke();

    ctx.restore();
  }

  function drawConnections() {
    for (const c of connections) {
      drawConnectionPath(c, { selected: c.id === selectedConnectionId });
    }
    for (const cr of computeCrossings()) {
      const overColor = cr.overConn.id === selectedConnectionId ? '#ffeb3b' : '#ffa726';
      drawLogisticsBridge(cr.col, cr.row, overColor);
    }
  }

  function drawWireDragPreview() {
    if (!wireDragging || !wireDragFrom) return;
    const start = { x: wireDragFrom.x, y: wireDragFrom.y };
    const mid = { x: wireDragCurrent.x, y: start.y };
    const end = wireDragCurrent;
    ctx.save();
    ctx.strokeStyle = hoverInputPort ? '#66bb6a' : 'rgba(255,255,255,0.6)';
    ctx.lineWidth = 2;
    ctx.setLineDash([5, 4]);
    ctx.beginPath();
    const p0 = worldToScreen(start.x, start.y), p1 = worldToScreen(mid.x, mid.y), p2 = worldToScreen(end.x, end.y);
    ctx.moveTo(p0.x, p0.y);
    ctx.lineTo(p1.x, p1.y);
    ctx.lineTo(p2.x, p2.y);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.restore();
  }

  function drawSpawnPreview() {
    if (!spawnPreview) return;
    const rect = getDeviceRectWorld(spawnPreview.gridX, spawnPreview.gridY, spawnTemplate.w, spawnTemplate.h);

    // 预览时也检测是否会与现有设备重叠
    const rects = devices.map(d => {
      const pos = effectiveGridPos(d);
      return { id: d.id, gridX: pos.gridX, gridY: pos.gridY, w: d.w, h: d.h };
    });
    const previewRect = { gridX: spawnPreview.gridX, gridY: spawnPreview.gridY, w: spawnTemplate.w, h: spawnTemplate.h };
    const wouldCollide = rects.some(r => rectsOverlap(r, previewRect));

    const topLeft = worldToScreen(rect.x, rect.y);
    const sw = rect.w * scale;
    const sh = rect.h * scale;

    ctx.save();
    ctx.globalAlpha = 0.5;
    ctx.fillStyle = wouldCollide ? '#ff1744' : spawnTemplate.color;
    ctx.fillRect(topLeft.x, topLeft.y, sw, sh);
    ctx.lineWidth = 2;
    ctx.setLineDash([6, 4]);
    ctx.strokeStyle = wouldCollide ? '#ff1744' : spawnTemplate.borderColor;
    ctx.strokeRect(topLeft.x, topLeft.y, sw, sh);
    ctx.setLineDash([]);
    ctx.restore();
  }

  function draw() {
    drawGrid();
    drawConnections();
    drawDevices();
    drawSpawnPreview();
    drawWireDragPreview();
  }

  // ---- 画布内鼠标交互：平移 / 选中 / 拖拽已有设备 ----

  canvas.addEventListener('mousedown', (e) => {
    const outPort = findPortAt(e.clientX, e.clientY, 'output');
    if (outPort) {
      // 已被占用的输出口不允许再拖出新连线
      if (!isOutputPortUsed(outPort.deviceId, outPort.index)) {
        wireDragging = true;
        wireDragFrom = outPort;
        wireDragCurrent = { x: outPort.x, y: outPort.y };
        selectedId = null;
        selectedConnectionId = null;
        draw();
      }
      return;
    }

    const worldPos = screenToWorld(e.clientX, e.clientY);
    const hit = hitTestDevice(worldPos.x, worldPos.y);

    if (hit) {
      selectedId = hit.id;
      selectedConnectionId = null;
      draggingDeviceId = hit.id;
      dragDeviceWX = hit.gridX * GRID_SIZE;
      dragDeviceWY = hit.gridY * GRID_SIZE;
      dragOffsetWX = worldPos.x - dragDeviceWX;
      dragOffsetWY = worldPos.y - dragDeviceWY;
      canvas.style.cursor = 'grabbing';
      draw();
      return;
    }

    const connHit = hitTestConnection(e.clientX, e.clientY);
    if (connHit) {
      selectedConnectionId = connHit.id;
      selectedId = null;
      draw();
      return;
    }

    selectedId = null;
    selectedConnectionId = null;
    isPanning = true;
    lastMouseX = e.clientX;
    lastMouseY = e.clientY;
    canvas.style.cursor = 'grabbing';
    draw();
  });

  window.addEventListener('mousemove', (e) => {
    if (wireDragging) {
      wireDragCurrent = screenToWorld(e.clientX, e.clientY);
      hoverInputPort = findPortAt(e.clientX, e.clientY, 'input');
      draw();
    } else if (draggingDeviceId !== null) {
      const worldPos = screenToWorld(e.clientX, e.clientY);
      const rawX = worldPos.x - dragOffsetWX;
      const rawY = worldPos.y - dragOffsetWY;
      dragDeviceWX = Math.round(rawX / GRID_SIZE) * GRID_SIZE;
      dragDeviceWY = Math.round(rawY / GRID_SIZE) * GRID_SIZE;
      recomputeAllConnections();
      draw();
    } else if (isPanning) {
      const dx = e.clientX - lastMouseX;
      const dy = e.clientY - lastMouseY;
      offsetX += dx;
      offsetY += dy;
      lastMouseX = e.clientX;
      lastMouseY = e.clientY;
      draw();
    } else if (!spawning) {
      const worldPos = screenToWorld(e.clientX, e.clientY);
      if (findPortAt(e.clientX, e.clientY, 'output') || findPortAt(e.clientX, e.clientY, 'input')) {
        canvas.style.cursor = 'crosshair';
      } else {
        canvas.style.cursor = hitTestDevice(worldPos.x, worldPos.y) ? 'grab' : 'default';
      }
    }
  });

  window.addEventListener('mouseup', (e) => {
    if (wireDragging) {
      const target = findPortAt(e.clientX, e.clientY, 'input');
      if (target && target.deviceId !== wireDragFrom.deviceId && !isInputPortUsed(target.deviceId, target.index)) {
        const conn = {
          id: nextConnId++,
          fromDeviceId: wireDragFrom.deviceId,
          fromPort: wireDragFrom.index,
          toDeviceId: target.deviceId,
          toPort: target.index,
          points: [],
          cellPath: null,
          invalid: false
        };
        const res = computePath(conn);
        conn.points = res.points;
        conn.cellPath = res.cellPath;
        conn.invalid = res.invalid;
        connections.push(conn);
        selectedConnectionId = conn.id;
      }
      wireDragging = false;
      wireDragFrom = null;
      hoverInputPort = null;
      draw();
      return;
    }

    if (draggingDeviceId !== null) {
      const dev = devices.find(d => d.id === draggingDeviceId);
      if (dev) {
        dev.gridX = Math.round(dragDeviceWX / GRID_SIZE);
        dev.gridY = Math.round(dragDeviceWY / GRID_SIZE);
        recomputeAllConnections();
      }
    }
    draggingDeviceId = null;
    isPanning = false;
    canvas.style.cursor = 'default';
    draw();
  });

  canvas.addEventListener('wheel', (e) => {
    e.preventDefault();
    const zoomIntensity = 0.1;
    const direction = e.deltaY > 0 ? -1 : 1;
    const factor = 1 + direction * zoomIntensity;
    const newScale = Math.min(4, Math.max(0.2, scale * factor));
    if (newScale === scale) return;

    const worldPos = screenToWorld(e.clientX, e.clientY);
    scale = newScale;
    offsetX = e.clientX - worldPos.x * scale;
    offsetY = e.clientY - worldPos.y * scale;
    draw();
  }, { passive: false });

  // ---- 键盘删除 ----

  window.addEventListener('keydown', (e) => {
    if (e.key !== 'Delete' && e.key !== 'Backspace') return;
    if (selectedConnectionId !== null) {
      e.preventDefault();
      connections = connections.filter(c => c.id !== selectedConnectionId);
      selectedConnectionId = null;
      draw();
    } else if (selectedId !== null) {
      e.preventDefault();
      connections = connections.filter(c => c.fromDeviceId !== selectedId && c.toDeviceId !== selectedId);
      devices = devices.filter(d => d.id !== selectedId);
      selectedId = null;
      recomputeAllConnections();
      draw();
    }
  });

  // ---- 工具栏拖拽生成新设备 ----

  function isPointInToolbar(x, y) {
    const r = toolbar.getBoundingClientRect();
    return x >= r.left && x <= r.right && y >= r.top && y <= r.bottom;
  }

  crusherIcon.addEventListener('mousedown', (e) => {
    e.preventDefault();
    spawning = true;
    ghostIcon.style.display = 'flex';
    ghostIcon.style.left = (e.clientX - 28) + 'px';
    ghostIcon.style.top = (e.clientY - 28) + 'px';
    updateSpawnPreview(e.clientX, e.clientY);
  });

  function updateSpawnPreview(clientX, clientY) {
    if (isPointInToolbar(clientX, clientY)) {
      spawnPreview = null;
      return;
    }
    const worldPos = screenToWorld(clientX, clientY);
    const rawX = worldPos.x - (spawnTemplate.w * GRID_SIZE) / 2;
    const rawY = worldPos.y - (spawnTemplate.h * GRID_SIZE) / 2;
    spawnPreview = {
      gridX: Math.round(rawX / GRID_SIZE),
      gridY: Math.round(rawY / GRID_SIZE)
    };
  }

  window.addEventListener('mousemove', (e) => {
    if (!spawning) return;
    ghostIcon.style.left = (e.clientX - 28) + 'px';
    ghostIcon.style.top = (e.clientY - 28) + 'px';
    updateSpawnPreview(e.clientX, e.clientY);
    draw();
  });

  window.addEventListener('mouseup', (e) => {
    if (!spawning) return;
    spawning = false;
    ghostIcon.style.display = 'none';

    if (spawnPreview && !isPointInToolbar(e.clientX, e.clientY)) {
      const newDevice = {
        id: nextId++,
        gridX: spawnPreview.gridX,
        gridY: spawnPreview.gridY,
        w: spawnTemplate.w,
        h: spawnTemplate.h,
        color: spawnTemplate.color,
        borderColor: spawnTemplate.borderColor,
        label: spawnTemplate.label
      };
      devices.push(newDevice);
      selectedId = newDevice.id;
      recomputeAllConnections();
    }
    spawnPreview = null;
    draw();
  });

  // 初始化
  initView();
  resize();
})();
</script>
</body>
</html>
