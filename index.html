<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="传送带工厂布局模拟器：设备摆放旋转、自由传送带模式画线、自动汇流/分流、手动路径调整、端点重接、Ctrl+Z 撤销。">
<title>传送带工厂布局模拟器</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<canvas id="canvas"></canvas>

<div id="toolbar">
  <div class="toolbar-title">设备库</div>
  <div id="toolbar-tabs"></div>
  <div id="toolbar-icons"></div>
</div>

<div id="hint"></div>

<div id="power-summary"></div>

<div id="map-selector">
  <label for="map-select">地图</label>
  <select id="map-select"></select>
</div>

<div id="map-confirm-overlay">
  <div id="map-confirm-box">
    <div id="map-confirm-message"></div>
    <div id="map-confirm-actions">
      <button id="map-confirm-cancel" type="button">取消</button>
      <button id="map-confirm-ok" type="button">确定切换</button>
    </div>
  </div>
</div>

<div id="recipe-panel-overlay">
  <div id="recipe-panel-box">
    <div id="recipe-panel-header">
      <div id="recipe-panel-title"></div>
      <button id="recipe-panel-close" type="button" title="关闭">✕</button>
    </div>
    <div id="recipe-panel-body"></div>
    <div id="recipe-panel-actions">
      <button id="recipe-panel-clear-all" type="button">清空全部</button>
    </div>
  </div>
</div>

<div id="item-picker-overlay"></div>
<div id="item-picker-drawer">
  <div id="item-picker-header">
    <input id="item-picker-search" type="text" placeholder="搜索物品…" autocomplete="off">
    <button id="item-picker-cancel" type="button">取消</button>
  </div>
  <div id="item-picker-tabs"></div>
  <div id="item-picker-grid"></div>
</div>

<script type="module" src="/src/main.js"></script>
</body>
</html>
